<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaLab - Image Filter Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-5 fw-bold">ChromaLab</h1>

        <div class="row g-4 align-items-start">

            <div class="col-lg-5 text-center">
                <div class="preview-wrapper">
                    <img src="image.jpg" id="previewImage" class="preview-img">
                </div>
            </div>


            <div class="col-lg-7">
                <div class="card shadow-sm p-4 border-0 rounded-4">

                    <div class="mb-3">
                        <label class="form-label">Blur (px)</label>
                        <input type="range" class="form-range" id="blur" min="0" max="20" value="0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Brightness (%)</label>
                        <input type="range" class="form-range" id="brightness" min="0" max="200" value="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contrast (%)</label>
                        <input type="range" class="form-range" id="contrast" min="0" max="200" value="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Grayscale (%)</label>
                        <input type="range" class="form-range" id="grayscale" min="0" max="100" value="0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sepia (%)</label>
                        <input type="range" class="form-range" id="sepia" min="0" max="100" value="0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Hue Rotate (deg)</label>
                        <input type="range" class="form-range" id="hue" min="0" max="360" value="0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Saturate (%)</label>
                        <input type="range" class="form-range" id="saturate" min="0" max="300" value="100">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Opacity (%)</label>
                        <input type="range" class="form-range" id="opacity" min="0" max="100" value="100">
                    </div>

                    <h6 class="fw-bold">CSS Code</h6>

                    <div class="code-box mb-3" id="cssCode">
                        filter: blur(0px) brightness(100%) contrast(100%);
                    </div>

                    <button class="btn-gradient w-100" id="copyBtn">
                        Copy CSS
                    </button>

                </div>
            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <footer style="width:100%;padding:18px 20px;text-align:center;font-size:13px;color:inherit;position:relative;z-index:5">Copyright © 2026 All rights reserved | This template is made with <a href="https://github.com/shahrozkhan-tech" target="_blank" rel="noopener" style="color:inherit">shahroz khan</a></footer>
    <script src="app.js"></script>
</body>

</html>
